@layer reset {
  @scope ([data-astryx-theme="warm-docs"]) to ([data-astryx-theme]) {
  :where(h1, h2, h3, h4, h5, h6) { font-family: var(--font-family-heading); color: var(--color-text-primary); }
  :where(h1) { font-size: var(--text-heading-1-size); font-weight: var(--text-heading-1-weight); line-height: var(--text-heading-1-leading); }
  :where(h2) { font-size: var(--text-heading-2-size); font-weight: var(--text-heading-2-weight); line-height: var(--text-heading-2-leading); }
  :where(h3) { font-size: var(--text-heading-3-size); font-weight: var(--text-heading-3-weight); line-height: var(--text-heading-3-leading); }
  :where(h4) { font-size: var(--text-heading-4-size); font-weight: var(--text-heading-4-weight); line-height: var(--text-heading-4-leading); }
  :where(h5) { font-size: var(--text-heading-5-size); font-weight: var(--text-heading-5-weight); line-height: var(--text-heading-5-leading); }
  :where(h6) { font-size: var(--text-heading-6-size); font-weight: var(--text-heading-6-weight); line-height: var(--text-heading-6-leading); }
  :where(p) { font-family: var(--font-family-body); font-size: var(--text-body-size); font-weight: var(--text-body-weight); line-height: var(--text-body-leading); color: var(--color-text-primary); }
  :where(small) { font-size: var(--text-supporting-size); font-weight: var(--text-supporting-weight); line-height: var(--text-supporting-leading); color: var(--color-text-secondary); }
  :where(code, pre) { font-family: var(--font-family-code); font-size: var(--text-code-size); line-height: var(--text-code-leading); }
  :where(hr) { border-right-width: medium; border-bottom-width: medium; border-left-width: medium; border-right-style: none; border-bottom-style: none; border-left-style: none; border-right-color: currentcolor; border-bottom-color: currentcolor; border-left-color: currentcolor; border-image: none; border-top: 1px solid var(--color-border); }
}
}
@layer astryx-theme {
  @scope ([data-astryx-theme="warm-docs"]) to ([data-astryx-theme]) {
  :scope { --color-accent: light-dark(#D97706, #FBBF24); --color-background-surface: light-dark(#FFF7ED, #1F1300); --color-background-card: light-dark(#FFFBEB, #2A1A05); --color-text-primary: light-dark(#3B2F15, #FEF3C7); --color-text-secondary: light-dark(#92400E, #FCD34D); --color-border: light-dark(#FED7AA, #92400E66); --radius-container: 20px; }
}

  [data-astryx-media="light"] { color-scheme: light; --color-text-primary: var(--color-on-light); --color-icon-primary: var(--color-on-light); --color-accent: var(--color-on-light); }
}
