<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>typer preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #101014;
        --typer-fg: #ececf1;
        --typer-bg: #101014;
        --typer-accent: #7aa2ff;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- The bank's typer.html imports "./typer.js", which was never captured — only
         typer.ts was. So this wrapper reproduces that page's markup and drives the
         same TyperGroup straight from the TypeScript source, which Vite compiles. -->
    <div
      class="typer-block"
      style="display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:600;font-size:clamp(1.4rem,4vw,2.4rem)"
    >
      <span data-typer data-typer-type="initial">design engineered by me :)</span>
    </div>

    <script type="module">
      import "/ui/typography/typer/src/typer/standalone/typer.css";
      import { TyperGroup } from "/ui/typography/typer/src/typer/standalone/typer.ts";

      const lines = [...document.querySelectorAll("[data-typer]")];
      const group = new TyperGroup(lines, { fps: 20, cycles: 3 }, 0.15);
      group.in();

      // Replay on click so the effect can be watched more than once.
      document.body.addEventListener("click", () => group.in());
    </script>
  </body>
</html>
